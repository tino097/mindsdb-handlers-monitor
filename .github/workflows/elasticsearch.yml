name: MindsDB Elasticsearch Monitor CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mindsdb_pr:
        description: 'MindsDB PR number to test (e.g., 12345). Leave empty to use main branch.'
        required: false
        type: string
      mindsdb_fork:
        description: 'MindsDB fork owner (e.g., richardokonicha). Leave empty to use mindsdb/mindsdb.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      elasticsearch:
        image: elasticsearch:8.11.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -f http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r elasticsearch/requirements.txt
          # Install test reporting plugins
          pip install pytest-html pytest-json-report

      - name: Wait for Elasticsearch
        run: |
          echo "Waiting for Elasticsearch..."
          for i in {1..60}; do
            if curl -sf http://localhost:9200/_cluster/health >/dev/null 2>&1; then
              echo "✅ Elasticsearch is ready!"
              curl -s http://localhost:9200/_cluster/health | python3 -m json.tool
              break
            fi
            echo "[$i/60] Waiting..."
            sleep 2
          done

      - name: Load Kibana sample data
        run: |
          echo "📦 Loading official Kibana sample datasets..."

          # Start Kibana temporarily to load official sample data
          # Use --network host so Kibana can access Elasticsearch on localhost:9200
          docker run -d --name kibana-temp \
            --network host \
            -e ELASTICSEARCH_HOSTS=http://localhost:9200 \
            docker.elastic.co/kibana/kibana:8.11.0

          echo "⏳ Waiting for Kibana to start..."
          for i in {1..60}; do
            if curl -sf http://localhost:5601/api/status >/dev/null 2>&1; then
              echo "✅ Kibana is ready!"
              break
            fi
            echo "[$i/60] Waiting for Kibana..."
            sleep 3
          done

          # Load official sample datasets via Kibana API
          echo "Loading flights dataset..."
          curl -X POST "localhost:5601/api/sample_data/flights" \
            -H 'kbn-xsrf: true' \
            -H 'Content-Type: application/json'

          echo "Loading ecommerce dataset..."
          curl -X POST "localhost:5601/api/sample_data/ecommerce" \
            -H 'kbn-xsrf: true' \
            -H 'Content-Type: application/json'

          echo "Loading logs dataset..."
          curl -X POST "localhost:5601/api/sample_data/logs" \
            -H 'kbn-xsrf: true' \
            -H 'Content-Type: application/json'

          # Verify data was loaded
          echo ""
          echo "📊 Verifying loaded data..."
          curl -s "localhost:9200/_cat/indices/kibana_sample*?v&s=index"

          # Stop and remove Kibana container
          docker stop kibana-temp
          docker rm kibana-temp

          echo "✅ Official Kibana sample data loaded successfully"

      - name: Install & start MindsDB
        run: |
          python -m pip install --upgrade pip

          # Determine which MindsDB repo and branch to use
          if [ -n "${{ github.event.inputs.mindsdb_pr }}" ]; then
            # Test specific PR
            FORK="${{ github.event.inputs.mindsdb_fork }}"
            FORK="${FORK:-mindsdb}"
            echo "🔍 Testing MindsDB PR #${{ github.event.inputs.mindsdb_pr }} from ${FORK}/mindsdb"

            git clone https://github.com/${FORK}/mindsdb.git
            cd mindsdb
            gh pr checkout ${{ github.event.inputs.mindsdb_pr }}
          else
            # Use default: richardokonicha's fork for testing
            echo "📦 Installing MindsDB from richardokonicha/mindsdb (feature/elasticsearch-handler-update)"
            git clone https://github.com/richardokonicha/mindsdb.git
            cd mindsdb
            git checkout feature/elasticsearch-handler-update
          fi

          pip install -e .[elasticsearch]

          echo "🚀 Starting MindsDB..."
          MINDSDB_NO_STUDIO=1 python -m mindsdb --api http --verbose > /tmp/mindsdb.log 2>&1 &
          echo "MINDSDB_PID=$!" >> $GITHUB_ENV

          echo "⏳ Waiting for MindsDB to be ready..."
          for i in $(seq 1 180); do
            echo "[$i] Checking MindsDB..."
            if curl -sf http://127.0.0.1:47334/api/status >/dev/null; then
              echo "✅ MindsDB is ready!"
              exit 0
            fi
            sleep 1
          done

          echo "❌ MindsDB failed to start"
          echo "=== MindsDB logs ==="
          cat /tmp/mindsdb.log
          exit 1

      - name: Verify services
        run: |
          echo "🔍 Verifying all services are running..."

          # Check Elasticsearch
          curl -sf http://localhost:9200/_cluster/health && echo "✅ Elasticsearch: Running" || echo "❌ Elasticsearch: Not Running"

          # Check MindsDB
          curl -sf http://127.0.0.1:47334/api/status | tee /tmp/mindsdb_status.json || echo "❌ MindsDB: Not responding"

          echo ""
          echo "📋 MindsDB Status:"
          cat /tmp/mindsdb_status.json | python3 -m json.tool || true

      - name: Run tests with result tracking
        env:
          ELASTICSEARCH_HOST: localhost:9200
          ELASTICSEARCH_USER: elastic
          ELASTICSEARCH_PASSWORD: changeme
          MINDSDB_API_URL: http://localhost:47334
        run: |
          echo "🧪 Running Elasticsearch handler tests..."

          # Create results directory
          mkdir -p /tmp/test_results

          # Run tests with detailed output and reporting
          cd elasticsearch/tests
          pytest -v --tb=short \
            --junit-xml=/tmp/test_results/junit.xml \
            --html=/tmp/test_results/report.html \
            --self-contained-html \
            || TEST_EXIT_CODE=$?

          # Exit with the test result code
          exit ${TEST_EXIT_CODE:-0}

      - name: Generate test summary
        if: always()
        run: |
          set -eu
          echo "=== Generating Test Summary ==="

          # Initialize counters
          total_tests=0
          passed=0
          failed=0
          errors=0
          skipped=0

          # Check if JUnit XML exists
          if [ -f /tmp/test_results/junit.xml ]; then
            # Parse JUnit XML for test counts
            if command -v python3 &> /dev/null; then
              python3 <<'PYEOF' > /tmp/test_summary.txt
          import xml.etree.ElementTree as ET
          import sys

          try:
              tree = ET.parse('/tmp/test_results/junit.xml')
              root = tree.getroot()

              testsuite = root.find('.//testsuite')
              if testsuite is not None:
                  tests = int(testsuite.get('tests', 0))
                  failures = int(testsuite.get('failures', 0))
                  errors = int(testsuite.get('errors', 0))
                  skipped = int(testsuite.get('skipped', 0))
                  passed = tests - failures - errors - skipped

                  print(f"{tests},{passed},{failures},{errors},{skipped}")
              else:
                  print("0,0,0,0,0")
          except Exception as e:
              print(f"0,0,0,0,0", file=sys.stderr)
              print(f"Error: {e}", file=sys.stderr)
          PYEOF

              if [ -f /tmp/test_summary.txt ]; then
                IFS=',' read -r total_tests passed failed errors skipped < /tmp/test_summary.txt
              fi
            fi
          fi

          # Calculate success rate
          success_rate=0
          if [ $total_tests -gt 0 ]; then
            success_rate=$(( passed * 100 / total_tests ))
          fi

          # Generate markdown summary
          {
            echo "# MindsDB Elasticsearch Handler Test Results"
            echo ""
            echo "## Summary"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Total Tests | $total_tests |"
            echo "| ✅ Passed | $passed |"
            echo "| ❌ Failed | $failed |"
            echo "| ⚠️ Errors | $errors |"
            echo "| ⏭️ Skipped | $skipped |"
            echo "| Success Rate | ${success_rate}% |"
            echo ""

            # Overall status
            if [ $total_tests -eq 0 ]; then
              echo "## ⚠️ No Tests Found"
            elif [ $passed -eq $total_tests ]; then
              echo "## 🎉 All Tests Passed!"
            elif [ $passed -gt 0 ]; then
              echo "## ⚠️ Partial Success"
            else
              echo "## ❌ All Tests Failed"
            fi

            echo ""
            echo "**Analysis completed:** $(date '+%A, %B %d, %Y at %I:%M %p %Z')"

          } > /tmp/combined_summary.md

          # Output to GitHub Actions summary
          cat /tmp/combined_summary.md >> $GITHUB_STEP_SUMMARY

          echo "✅ Test summary generated"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mindsdb-elasticsearch-test-results
          path: |
            /tmp/test_results/
            /tmp/mindsdb.log
            /tmp/combined_summary.md
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up..."
          if [ -n "${MINDSDB_PID:-}" ]; then
            kill ${MINDSDB_PID} || true
            echo "✅ MindsDB stopped"
          fi
